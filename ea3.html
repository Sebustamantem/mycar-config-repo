<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador EA3 · GPY6111</title><style>body{font:16px system-ui;background:#f0f4fa;color:#18233b;margin:0}.wrap{max-width:760px;margin:35px auto;padding:16px}.card{background:white;border-radius:20px;padding:26px;box-shadow:0 10px 30px #142d4b15}h1{margin:0 0 12px}h2{line-height:1.4}small,.muted{color:#64748b}.bar{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#4f46e5}.opt{display:block;width:100%;padding:15px;text-align:left;background:#fff;border:1px solid #cbd5e1;border-radius:12px;margin:10px 0;font-size:16px;cursor:pointer}.opt:hover{border-color:#6366f1}.ok{background:#dcfce7!important;border-color:#16a34a}.bad{background:#fee2e2!important;border-color:#dc2626}.btn{background:#4f46e5;color:white;border:0;border-radius:11px;padding:13px 20px;font-weight:bold;cursor:pointer;margin:10px 8px 0 0}.secondary{background:#e2e8f0;color:#1e293b}.feedback{padding:16px;background:#f1f5f9;border-radius:12px;margin-top:16px;line-height:1.55}.score{font-size:54px;font-weight:800;text-align:center}a{color:#4f46e5}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#e2e8f0}.card,.opt{background:#1e293b;color:#e2e8f0}.feedback{background:#334155}.secondary{background:#475569;color:white}}</style></head><body><div class="wrap"><main id="app" class="card"></main></div><script>
const DATA=[["VF","Monitoreo","Monitoreo y control ocurre solo al finalizar la ejecución.",["Verdadero","Falso"],1,"Es falso porque el monitoreo y control acompaña a la ejecución y compara resultados con las líneas base. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Cambios","¿Qué proceso PMBOK gestiona el control integrado de cambios?",["4.3","4.6","5.5","7.4"],1,"La alternativa correcta es «4.6». El PMBOK 6.ª edición identifica el control integrado de cambios como proceso 4.6. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Cambios","Las solicitudes rechazadas también se registran.",["Verdadero","Falso"],0,"Es verdadero porque el registro conserva la trazabilidad de todas las decisiones, incluso rechazos. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Cambios","Un sprint lleva cinco días de atraso y se asigna otro desarrollador. ¿Qué acción es?",["Preventiva","Actualización","Correctiva","Reparación de defecto"],2,"La alternativa correcta es «Correctiva». El retraso ya ocurrió, por eso la medida es correctiva y no preventiva. Las otras opciones no describen correctamente el concepto evaluado."],["ALT","Cambios","Antes de implementar un cambio en la línea base se debe:",["Implementarlo","Aprobarlo tras analizar impacto","Avisar solo al equipo","Cambiar el presupuesto"],1,"La alternativa correcta es «Aprobarlo tras analizar impacto». El proceso exige evaluar el impacto y obtener autorización antes de ejecutar. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Líneas base","La línea base de costos incluye contingencia, pero excluye reserva de gestión.",["Verdadero","Falso"],0,"Es verdadero porque las reservas de contingencia forman parte de la línea base de costos; la reserva de gestión queda fuera. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","APO y FAE","¿Cuál es un APO?",["Nueva ley","Tipo de cambio","Plantilla histórica de solicitudes","Condiciones de mercado"],2,"La alternativa correcta es «Plantilla histórica de solicitudes». Las plantillas y procedimientos históricos son recursos internos de la organización. Las otras opciones no describen correctamente el concepto evaluado."],["VF","APO y FAE","Una nueva normativa de protección de datos puede ser un FAE.",["Verdadero","Falso"],0,"Es verdadero porque la normativa es un factor ambiental que puede obligar a ajustar el proyecto. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Caso SIGRI","¿Qué se decidió sobre la integración con ERP (CR-02)?",["Aprobar","Rechazar definitivamente","Diferir a fase 2","Implementar"],2,"La alternativa correcta es «Diferir a fase 2». El CCB difirió la integración porque la proyección de costo excedía el límite autorizado. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Configuración","La gestión de configuración identifica la versión vigente de un entregable.",["Verdadero","Falso"],0,"Es verdadero porque la gestión de configuración permite identificar y auditar las versiones vigentes. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Ley 21.719","¿Cuál es la fecha general de entrada en vigencia según la guía?",["13/12/2024","01/01/2025","01/12/2026","31/12/2027"],2,"La alternativa correcta es «01/12/2026». La guía señala como fecha general de vigencia el 1 de diciembre de 2026. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Ley 21.719","El consentimiento es la única base de licitud.",["Verdadero","Falso"],1,"Es falso porque el consentimiento es una base posible, pero existen otras bases de licitud. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Ley 21.719","¿Qué derecho permite corregir datos inexactos?",["Portabilidad","Rectificación","Oposición","Bloqueo"],1,"La alternativa correcta es «Rectificación». Rectificación es el derecho a corregir datos inexactos, incompletos o desactualizados. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Ley 21.719","Proporcionalidad permite recolectar cualquier dato por si sirve después.",["Verdadero","Falso"],1,"Es falso porque proporcionalidad limita la recolección a los datos necesarios para una finalidad concreta. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Ley 21.719","¿Quién determina fines y medios del tratamiento?",["Encargado","Scrum Master","Responsable","Usuario"],2,"La alternativa correcta es «Responsable». El responsable decide fines y medios; el encargado actúa por cuenta del responsable. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Ley 21.719","La anonimización es irreversible; la seudonimización requiere información adicional para atribuir los datos.",["Verdadero","Falso"],0,"Es verdadero porque la anonimización impide identificar de forma irreversible; la seudonimización mantiene información adicional separada. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Ley 21.719","Al añadir geolocalización permanente a una app, corresponde:",["Agregar sin revisar","Recolectar todo","Revisar finalidad, riesgos y backlog","Eliminar pruebas"],2,"La alternativa correcta es «Revisar finalidad, riesgos y backlog». Agregar geolocalización obliga a revisar finalidad, proporcionalidad, seguridad y requisitos del producto. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Ley 21.719","La Ley 21.719 crea la Agencia de Protección de Datos Personales.",["Verdadero","Falso"],0,"Es verdadero porque la ley crea la Agencia de Protección de Datos Personales. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Valor ganado","¿Qué representa PV?",["Costo real","Presupuesto del trabajo planificado a la fecha","Trabajo efectivamente realizado","Costo final esperado"],1,"La alternativa correcta es «Presupuesto del trabajo planificado a la fecha». PV representa el presupuesto del trabajo previsto a la fecha de corte. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Valor ganado","CPI menor que 1 indica sobrecosto.",["Verdadero","Falso"],0,"Es verdadero porque cPI menor que uno significa que el costo real supera el valor ganado. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Valor ganado","EV = 17,19 M y AC = 18,60 M. ¿Cuál es CV?",["+1,41 M","−1,41 M","−1,91 M","+35,79 M"],1,"La alternativa correcta es «−1,41 M». CV negativo indica sobrecosto: el valor ganado es menor que el costo real. Las otras opciones no describen correctamente el concepto evaluado."],["ALT","Valor ganado","SPI = 0,90 y CPI = 0,92. El proyecto está:",["Adelantado y económico","Atrasado y con sobrecosto","Adelantado y caro","Atrasado y económico"],1,"La alternativa correcta es «Atrasado y con sobrecosto». SPI y CPI inferiores a uno significan atraso y sobrecosto, respectivamente. Las otras opciones no describen correctamente el concepto evaluado."],["ALT","Valor ganado","BAC 47,7 M y CPI 0,92. ¿EAC típica aproximada?",["43,9 M","47,7 M","51,8 M","18,6 M"],2,"La alternativa correcta es «51,8 M». EAC típica divide BAC por CPI, suponiendo continuidad del desempeño actual. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Valor ganado","Si EV es menor que PV, SV es negativa.",["Verdadero","Falso"],0,"Es verdadero porque sV negativa significa que el valor ganado está por debajo del valor planificado. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Alcance","¿Qué proceso formaliza aceptación del cliente?",["Control de calidad","Validar alcance","Controlar costos","Monitorear riesgos"],1,"La alternativa correcta es «Validar alcance». La aceptación formal del cliente corresponde a validar el alcance, no a controlar calidad. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Desempeño","Datos, información e informes de desempeño son equivalentes.",["Verdadero","Falso"],1,"Es falso porque los datos son mediciones brutas; la información incorpora análisis; los informes consolidan conclusiones. Para que la afirmación sea correcta, debe respetar esta regla."],["ALT","Informes","Un informe de avance debe considerar:",["Solo porcentaje","Solo presupuesto","Alcance, cronograma, costos, recursos y decisiones","Solo tareas terminadas"],2,"La alternativa correcta es «Alcance, cronograma, costos, recursos y decisiones». El informe incluye desempeño por dimensión, cambios, riesgos, decisiones y próximos pasos. Las otras opciones no describen correctamente el concepto evaluado."],["VF","Cambios","Una solicitud diferida debe registrar condición y fecha de revisión.",["Verdadero","Falso"],0,"Es verdadero porque las solicitudes diferidas requieren condición y fecha para reevaluarse. Para que la afirmación sea correcta, debe respetar esta regla."]];let list=[],index=0,correct=0,wrong=[],locked=false;const app=document.getElementById('app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){app.innerHTML='<h1>Simulador GPY6111 · EA3</h1><p>Control integrado de cambios, Ley 21.719, Valor Ganado.</p><p class="muted">28 preguntas · Verdadero/Falso y alternativas · Explicación inmediata · Nota final y repaso de errores</p><p><a href="index.html">← Volver a la prueba anterior</a></p><button class="btn" onclick="start(DATA)">Comenzar prueba</button>'}
function start(src){list=shuffle(src).map(q=>({...q,options:shuffle(q[3].map((v,i)=>({v,i})))}));index=0;correct=0;wrong=[];step()}
function step(){if(index>=list.length)return end();locked=false;const q=list[index];app.innerHTML='<small>Pregunta '+(index+1)+' de '+list.length+' · '+esc(q[1])+' · '+(q[0]==='VF'?'Verdadero/Falso':'Alternativas')+'</small><div class="bar"><div class="fill" style="width:'+(100*index/list.length)+'%"></div></div><h2>'+esc(q[2])+'</h2>'+q.options.map((o,i)=>'<button class="opt" onclick="answer('+i+')">'+(q[0]==='ALT'?'ABCD'[i]+') ':'')+esc(o.v)+'</button>').join('')+'<div id="feedback"></div>'}
function answer(i){if(locked)return;locked=true;const q=list[index],choice=q.options[i],yes=choice.i===q[4];if(yes)correct++;else wrong.push(q);document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.options[j].i===q[4])b.classList.add('ok');else if(j===i)b.classList.add('bad')});document.getElementById('feedback').innerHTML='<div class="feedback"><b>'+(yes?'✓ Correcto':'✗ Incorrecto')+'</b><p>Respuesta correcta: '+esc(q[3][q[4]])+'</p><p>'+esc(q[5])+'</p></div><button class="btn" onclick="index++;step()">'+(index===list.length-1?'Ver resultados':'Siguiente →')+'</button>'}
function end(){const pct=Math.round(100*correct/list.length),grade=(1+6*correct/list.length).toFixed(1).replace('.',',');app.innerHTML='<h1>Resultados</h1><div class="score">'+pct+'%</div><p style="text-align:center">'+correct+' de '+list.length+' correctas · Nota referencial '+grade+'</p><p class="muted">Nota lineal de 1,0 a 7,0; no representa una escala institucional.</p><button class="btn" onclick="start(DATA)">Repetir prueba completa</button>'+(wrong.length?'<button class="btn secondary" onclick="start(wrong)">Practicar errores ('+wrong.length+')</button>':'')+'<button class="btn secondary" onclick="home()">Inicio</button>'}
home();</script></body></html>
