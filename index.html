<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz GPY6111</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f6fb;margin:0;color:#111827}
.wrap{max-width:760px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 2px 12px #0001}
h1{margin-top:0}h2{font-size:20px;line-height:1.35}.muted{color:#64748b;font-size:14px}
.top{display:flex;justify-content:space-between;gap:10px}.barbg{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:#4f46e5}
.opt{width:100%;text-align:left;padding:14px;margin:8px 0;border:1px solid #cbd5e1;border-radius:12px;background:white;font-size:16px}
.ok{border-color:#059669!important;background:#d1fae5!important}.bad{border-color:#dc2626!important;background:#fee2e2!important}.dim{opacity:.5}
.fb{margin-top:15px;padding:14px;border-radius:12px;font-weight:700}.fbok{background:#d1fae5;color:#047857}.fbbad{background:#fee2e2;color:#b91c1c}
button.main,button.sec{padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;margin-top:14px}
button.main{background:#4f46e5;color:white;border:0}.sec{background:white;border:1px solid #cbd5e1}.score{text-align:center;font-size:48px;font-weight:800}
@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f8fafc}.card,.opt,.sec{background:#111827;color:#f8fafc}.barbg{background:#334155}}
</style>
</head>
<body><div class="wrap"><div id="app" class="card"></div></div>
<script>
const Q=[{"n":1,"tipo":"Alternativas","tema":"Plan de Dirección","pregunta":"Según lo revisado en clases, el Plan para la Dirección del Proyecto:","correcta":"Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","opciones":["El enunciado del alcance, la EDT y el diccionario de la EDT.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Las características y funciones que describen un producto, servicio o resultado.","Alcance, cronograma y costos."],"exp":""},{"n":2,"tipo":"Alternativas","tema":"Plan de Dirección","pregunta":"¿Cuáles son las tres líneas base que contiene el Plan para la Dirección del Proyecto?","correcta":"Alcance, cronograma y costos.","opciones":["Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Las características y funciones que describen un producto, servicio o resultado.","El enunciado del alcance, la EDT y el diccionario de la EDT.","Alcance, cronograma y costos."],"exp":""},{"n":3,"tipo":"Alternativas","tema":"Alcance","pregunta":"El «alcance del producto» se refiere a:","correcta":"Las características y funciones que describen un producto, servicio o resultado.","opciones":["El enunciado del alcance, la EDT y el diccionario de la EDT.","Las características y funciones que describen un producto, servicio o resultado.","Alcance, cronograma y costos.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra."],"exp":""},{"n":4,"tipo":"Alternativas","tema":"Alcance / EDT","pregunta":"La línea base del alcance es la versión aprobada de:","correcta":"El enunciado del alcance, la EDT y el diccionario de la EDT.","opciones":["Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","El enunciado del alcance, la EDT y el diccionario de la EDT.","Alcance, cronograma y costos.","El acta de constitución, el cronograma y el presupuesto."],"exp":""},{"n":5,"tipo":"Alternativas","tema":"Alcance","pregunta":"¿Cuál de los siguientes es un ejemplo de Factor Ambiental de la Empresa (FAE)?","correcta":"La cultura de la organización (por ejemplo, el estilo del gerente).","opciones":["La cultura de la organización (por ejemplo, el estilo del gerente).","Las políticas y procedimientos de la organización.","Alcance, cronograma y costos.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra."],"exp":""},{"n":6,"tipo":"Alternativas","tema":"EDT","pregunta":"El nivel más bajo de la EDT, donde el trabajo se programa, se estima, se sigue y se controla, se denomina:","correcta":"Paquete de trabajo.","opciones":["Las características y funciones que describen un producto, servicio o resultado.","Alcance, cronograma y costos.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Paquete de trabajo."],"exp":""},{"n":7,"tipo":"Alternativas","tema":"Cronograma","pregunta":"En el método de diagramación por precedencia, «la actividad B no puede iniciar hasta que la actividad A haya finalizado» corresponde a la relación:","correcta":"Final a Inicio (FI).","opciones":["Las características y funciones que describen un producto, servicio o resultado.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Final a Inicio (FI).","Alcance, cronograma y costos."],"exp":""},{"n":8,"tipo":"Alternativas","tema":"Cronograma","pregunta":"¿Qué técnica de estimación usa información histórica de proyectos similares, sirve en las fases iniciales y es menos costosa, pero también menos exacta?","correcta":"Estimación análoga.","opciones":["Estimación análoga.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Alcance, cronograma y costos.","Estimación paramétrica."],"exp":""},{"n":9,"tipo":"Alternativas","tema":"Cronograma","pregunta":"La ruta crítica de un proyecto es:","correcta":"La secuencia de actividades que representa el camino más largo y determina la duración más corta posible del proyecto.","opciones":["La secuencia de actividades que representa el camino más largo y determina la duración más corta posible del proyecto.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Alcance, cronograma y costos.","Las características y funciones que describen un producto, servicio o resultado."],"exp":""},{"n":10,"tipo":"Alternativas","tema":"Comunicaciones","pregunta":"En el enfoque jerárquico de las comunicaciones, la comunicación ASCENDENTE se dirige a:","correcta":"Los interesados de la alta dirección.","opciones":["Alcance, cronograma y costos.","Define la manera en que el proyecto se ejecuta, se monitorea, se controla y se cierra.","Los proveedores y el público en general.","Los interesados de la alta dirección."],"exp":""},{"n":11,"tipo":"Verdadero o falso","tema":"Alcance","pregunta":"El alcance del proyecto incluye el alcance del producto.","correcta":"Verdadero","opciones":["Verdadero","Falso"],"exp":""},{"n":12,"tipo":"Verdadero o falso","tema":"EDT","pregunta":"La EDT muestra la secuencia en que deben ejecutarse las actividades del proyecto.","correcta":"Falso","opciones":["Verdadero","Falso"],"exp":""},{"n":13,"tipo":"Verdadero o falso","tema":"Cronograma","pregunta":"Las actividades de la ruta crítica tienen holgura positiva, por lo que pueden retrasarse sin afectar la fecha de término.","correcta":"Falso","opciones":["Verdadero","Falso"],"exp":""},{"n":14,"tipo":"Verdadero o falso","tema":"Cronograma","pregunta":"Las dependencias discrecionales (lógica blanda) son las requeridas por contrato o inherentes a la naturaleza del trabajo.","correcta":"Falso","opciones":["Falso","Verdadero"],"exp":""},{"n":15,"tipo":"Verdadero o falso","tema":"Cronograma","pregunta":"La estimación de la duración de las actividades es un proceso gradual e iterativo.","correcta":"Verdadero","opciones":["Falso","Verdadero"],"exp":""},{"n":16,"tipo":"Verdadero o falso","tema":"Cronograma","pregunta":"Duración y esfuerzo son conceptos equivalentes en la planificación del cronograma.","correcta":"Falso","opciones":["Verdadero","Falso"],"exp":""},{"n":17,"tipo":"Verdadero o falso","tema":"Comunicaciones","pregunta":"La comunicación externa se centra en interesados como clientes, proveedores, otros proyectos, el gobierno y el público.","correcta":"Verdadero","opciones":["Verdadero","Falso"],"exp":""},{"n":18,"tipo":"Verdadero o falso","tema":"Comunicaciones","pregunta":"El correo electrónico, los medios sociales y las discusiones ad hoc son ejemplos de comunicación formal.","correcta":"Falso","opciones":["Falso","Verdadero"],"exp":""},{"n":19,"tipo":"Completar la oración","tema":"Plan de Dirección","pregunta":"El Plan de Dirección de Proyecto establece el QUÉ, el CUÁNDO y el ___.","correcta":"QUIÉN","opciones":["POR QUÉ","descomposición","desempeño","QUIÉN"],"exp":""},{"n":20,"tipo":"Completar la oración","tema":"Plan de Dirección","pregunta":"Las líneas base del Plan de Dirección también se denominan líneas para la medición del ___.","correcta":"desempeño","opciones":["QUIÉN","desempeño","descomposición","alcance"],"exp":""},{"n":21,"tipo":"Completar la oración","tema":"EDT","pregunta":"La técnica para dividir y subdividir el alcance y los entregables del proyecto en partes más pequeñas y manejables se denomina ___.","correcta":"descomposición","opciones":["descomposición","desempeño","diccionario","QUIÉN"],"exp":""},{"n":22,"tipo":"Completar la oración","tema":"EDT","pregunta":"El ___ de la EDT registra el identificador, la descripción del trabajo, el responsable, los recursos, los estimados de costo, los requisitos de calidad, los criterios de aceptación y las referencias técnicas.","correcta":"diccionario","opciones":["desempeño","QUIÉN","diccionario","enunciado"],"exp":""},{"n":23,"tipo":"Completar la oración","tema":"Cronograma","pregunta":"Un ___ es el tiempo en que una actividad sucesora puede avanzar con respecto a una actividad predecesora.","correcta":"adelanto","opciones":["hito","desempeño","adelanto","QUIÉN"],"exp":""},{"n":24,"tipo":"Completar la oración","tema":"Cronograma","pregunta":"Con 8 horas por día y 22 días por mes, una persona trabajando 4 meses equivale a ___ horas-hombre.","correcta":"704","opciones":["704","528","880","352"],"exp":"8 × 22 × 4 = 704 horas-hombre."},{"n":25,"tipo":"Completar la oración","tema":"Comunicaciones","pregunta":"El proceso de garantizar que la recopilación, creación, distribución, almacenamiento, recuperación y disposición final de la información del proyecto sean oportunos y adecuados se denomina ___ las comunicaciones.","correcta":"Gestionar","opciones":["Controlar","QUIÉN","Gestionar","desempeño"],"exp":""}];
let list=[],i=0,ok=0,fails=[],answered=false;
const app=document.getElementById('app');
function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function menu(){app.innerHTML=`<h1>Quiz GPY6111</h1><p class="muted">Responde las 25 preguntas. Al elegir una opción verás inmediatamente si acertaste.</p><label><input id="mix" type="checkbox" checked> Mezclar preguntas</label><br><button class="main" onclick="start(Q)">Comenzar</button>`}
function start(src){list=document.getElementById('mix')?.checked===false?[...src]:sh(src);i=0;ok=0;fails=[];step()}
function step(){if(i>=list.length)return end();answered=false;let q=list[i];let p=Math.round(i*100/list.length);app.innerHTML=`<div class="top"><span class="muted">Pregunta ${i+1} de ${list.length}</span><span class="muted">${ok} correctas</span></div><div class="barbg"><div class="bar" style="width:${p}%"></div></div><div class="muted">${esc(q.tipo)} · ${esc(q.tema)}</div><h2>${esc(q.pregunta)}</h2><div>${q.opciones.map((o,k)=>`<button class="opt" onclick="ans(${k})">${esc(o)}</button>`).join('')}</div><div id="fb"></div>`}
function ans(k){if(answered)return;answered=true;let q=list[i],chosen=q.opciones[k],yes=chosen===q.correcta;if(yes)ok++;else fails.push(q);document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opciones[j]===q.correcta)b.classList.add('ok');else if(j===k)b.classList.add('bad');else b.classList.add('dim')});document.getElementById('fb').innerHTML=`<div class="fb ${yes?'fbok':'fbbad'}">${yes?'✓ Correcto':'✗ Incorrecto'}${yes?'':`<div>Correcta: ${esc(q.correcta)}</div>`}${q.exp?`<div>${esc(q.exp)}</div>`:''}</div><button class="main" onclick="next()">${i===list.length-1?'Ver resultado':'Siguiente →'}</button>`}
function next(){i++;step()}
function end(){let pct=Math.round(ok*100/list.length);app.innerHTML=`<h1 style="text-align:center">Resultado</h1><div class="score">${pct}%</div><p style="text-align:center">${ok} de ${list.length} correctas</p><div style="text-align:center"><button class="main" onclick="start(Q)">Repetir las 25</button>${fails.length?` <button class="sec" onclick="start(fails)">Practicar falladas (${fails.length})</button>`:''} <button class="sec" onclick="menu()">Inicio</button></div>`}
menu();
</script></body></html>
